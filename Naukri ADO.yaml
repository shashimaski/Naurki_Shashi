trigger: none

pool:
  name: Shashi_Pool

variables:
  azureServiceConnection: 'shashi-service-hp'
  storageAccount: 'maskisa'
  storageContainer: 'smcont'

stages:

# ============================================================
# BUILD STAGE
# ============================================================

- stage: Build
  displayName: 'Naukri CI Build'

  jobs:

  - job: BuildJob
    displayName: 'Build Application'

    steps:

    # ========================================================
    # CHECKOUT
    # ========================================================

    - checkout: self
      clean: true

    # ========================================================
    # VERIFY ADO CHECKOUT
    # ========================================================

    - task: PowerShell@2
      displayName: 'Verify ADO Checkout'
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "========================================"
          Write-Host "ADO CHECKOUT VERIFICATION"
          Write-Host "========================================"

          Write-Host "Build Sources Directory:"
          Write-Host "$(Build.SourcesDirectory)"

          Write-Host ""
          Write-Host "Repository Files:"
          Get-ChildItem "$(Build.SourcesDirectory)"

          Write-Host ""
          Write-Host "Build Directory:"

          $buildDir = "$(Build.SourcesDirectory)\build"

          if (-not (Test-Path $buildDir)) {
              Write-Error "Build directory not found: $buildDir"
              exit 1
          }

          Get-ChildItem $buildDir

          Write-Host ""
          Write-Host "Checking fetch-jre.ps1..."

          $jreScript = "$(Build.SourcesDirectory)\build\fetch-jre.ps1"

          if (-not (Test-Path $jreScript)) {
              Write-Error "fetch-jre.ps1 not found: $jreScript"
              exit 1
          }

          Write-Host "Found: $jreScript"

    # ========================================================
    # VERIFY BUILD ENVIRONMENT
    # ========================================================

    - task: PowerShell@2
      displayName: 'Verify Build Environment'
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "========================================"
          Write-Host "JAVA"
          Write-Host "========================================"
          java -version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "MAVEN"
          Write-Host "========================================"
          mvn -version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "NODE"
          Write-Host "========================================"
          node -v

          Write-Host ""
          Write-Host "========================================"
          Write-Host "NPM"
          Write-Host "========================================"
          npm -v

          Write-Host ""
          Write-Host "========================================"
          Write-Host "GIT"
          Write-Host "========================================"
          git --version

    # ========================================================
    # FETCH JAVA 17 JRE
    # ========================================================

    - task: PowerShell@2
      displayName: 'Fetch Java 17 JRE'
      inputs:
        targetType: 'filePath'
        filePath: '$(Build.SourcesDirectory)\build\fetch-jre.ps1'

    # ========================================================
    # INSTALL PLAYWRIGHT CHROMIUM
    # ========================================================

    - task: PowerShell@2
      displayName: 'Install Playwright Chromium'
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "========================================"
          Write-Host "INSTALL PLAYWRIGHT CHROMIUM"
          Write-Host "========================================"

          $script = "$(Build.SourcesDirectory)\build\install-playwright.ps1"

          if (-not (Test-Path $script)) {
              Write-Error "install-playwright.ps1 not found: $script"
              exit 1
          }

          & $script

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Playwright installation failed"
              exit $LASTEXITCODE
          }

          Write-Host "Playwright installation SUCCESS"

    # ========================================================
    # SONARCLOUD PREPARE
    # ========================================================

    - task: SonarCloudPrepare@3
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'SonarCloud-ServiceConnection'
        organization: 'shashimdevops'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'shashimdevops_ADO-Shashi'
        cliProjectName: 'ADO-Shashi'
        cliSources: '.'
        extraProperties: |
          sonar.sources=backend/src/main,mock-naukri/src/main,frontend
          sonar.tests=backend/src/test,mock-naukri/src/test

          sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/build/**,**/electron/resources/**,**/build-wrapper-dump.json

          sonar.test.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/build/**

    # ========================================================
    # BUILD BACKEND
    # ========================================================

    - task: CmdLine@2
      displayName: 'Build Backend'
      inputs:
        script: |

          echo ========================================
          echo BUILD BACKEND
          echo ========================================

          mvn -f backend\pom.xml clean package -DskipTests -Dmaven.test.skip=true

          if %ERRORLEVEL% NEQ 0 (
              echo Backend build FAILED
              exit /b %ERRORLEVEL%
          )

          echo Backend build SUCCESS

    # ========================================================
    # BUILD MOCK SERVER
    # ========================================================

    - task: CmdLine@2
      displayName: 'Build Mock Server'
      inputs:
        script: |

          echo ========================================
          echo BUILD MOCK SERVER
          echo ========================================

          mvn -f mock-naukri\pom.xml clean package -DskipTests -Dmaven.test.skip=true

          if %ERRORLEVEL% NEQ 0 (
              echo Mock server build FAILED
              exit /b %ERRORLEVEL%
          )

          echo Mock server build SUCCESS

    # ========================================================
    # BUILD FRONTEND
    # ========================================================

    - task: PowerShell@2
      displayName: 'Build Frontend'
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "========================================"
          Write-Host "BUILD FRONTEND"
          Write-Host "========================================"

          $script = "$(Build.SourcesDirectory)\build\phases\build-frontend.ps1"

          if (-not (Test-Path $script)) {
              Write-Error "build-frontend.ps1 not found: $script"
              exit 1
          }

          & $script

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Frontend build failed"
              exit $LASTEXITCODE
          }

          Write-Host "Frontend build SUCCESS"

    # ========================================================
    # SONARCLOUD ANALYZE
    # ========================================================

    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud Analysis'

    # ========================================================
    # SONARCLOUD QUALITY GATE
    # ========================================================

    - task: SonarCloudPublish@3
      displayName: 'Check SonarCloud Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

    # ========================================================
    # BUILD ELECTRON APPLICATION
    # ========================================================

    - task: PowerShell@2
      displayName: 'Build Electron Application'
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "========================================"
          Write-Host "BUILD ELECTRON APPLICATION"
          Write-Host "========================================"

          $script = "$(Build.SourcesDirectory)\build\phases\build-electron.ps1"

          if (-not (Test-Path $script)) {
              Write-Error "build-electron.ps1 not found: $script"
              exit 1
          }

          & $script -Variant Ship

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Electron build failed"
              exit $LASTEXITCODE
          }

          Write-Host "Electron build SUCCESS"

    # ========================================================
    # VERIFY EXE ARTIFACTS
    # ========================================================

    - task: PowerShell@2
      displayName: 'Verify EXE Artifacts'
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "========================================"
          Write-Host "VERIFY EXE ARTIFACTS"
          Write-Host "========================================"

          $dist = "$(Build.SourcesDirectory)\dist"

          if (-not (Test-Path $dist)) {
              Write-Error "dist directory does not exist"
              exit 1
          }

          Write-Host ""
          Write-Host "===== BUILD ARTIFACTS ====="

          Get-ChildItem $dist -Recurse -File |
              Select-Object FullName, Length

          Write-Host ""
          Write-Host "===== SEARCHING FOR EXE FILES ====="

          $exeFiles = @(
              Get-ChildItem `
                  -Path $dist `
                  -Recurse `
                  -Filter "*.exe" `
                  -File
          )

          if ($exeFiles.Count -eq 0) {
              Write-Error "No EXE artifacts found"
              exit 1
          }

          foreach ($exe in $exeFiles) {

              Write-Host "----------------------------------------"
              Write-Host "File : $($exe.FullName)"
              Write-Host "Size : $($exe.Length) bytes"
              Write-Host "----------------------------------------"

          }

          Write-Host "Artifact verification SUCCESS"

    # ========================================================
    # PUBLISH PIPELINE ARTIFACT
    # ========================================================

    - task: PublishPipelineArtifact@1
      displayName: 'Publish EXE Artifact'
      inputs:
        targetPath: '$(Build.SourcesDirectory)\dist'
        artifact: 'Naukri-EXE'
        publishLocation: 'pipeline'

    # ========================================================
    # UPLOAD EXE TO AZURE BLOB STORAGE
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Upload EXE to Azure Blob Storage'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "========================================"
          Write-Host "UPLOAD EXE TO AZURE BLOB STORAGE"
          Write-Host "========================================"

          $storageAccount = "$(storageAccount)"
          $container = "$(storageContainer)"
          $source = "$(Build.SourcesDirectory)\dist"

          Write-Host "Storage Account : $storageAccount"
          Write-Host "Container       : $container"
          Write-Host "Source          : $source"

          if (-not (Test-Path $source)) {
              Write-Error "Source directory does not exist: $source"
              exit 1
          }

          $exeFiles = @(
              Get-ChildItem `
                  -Path $source `
                  -Recurse `
                  -Filter "*.exe" `
                  -File
          )

          if ($exeFiles.Count -eq 0) {
              Write-Error "No EXE files found for upload"
              exit 1
          }

          Write-Host ""
          Write-Host "EXE files to upload:"

          foreach ($exe in $exeFiles) {
              Write-Host $exe.FullName
          }

          az storage blob upload-batch `
            --account-name "$storageAccount" `
            --destination "$container" `
            --source "$source" `
            --pattern "*.exe" `
            --auth-mode login `
            --overwrite true

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Azure Blob upload FAILED"
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "AZURE BLOB UPLOAD SUCCESS"
          Write-Host "========================================"


# ============================================================
# DEPLOYMENT STAGE
# ENVIRONMENT APPROVAL & CHECKS
# ============================================================

- stage: Deploy
  displayName: 'Naukri Release Deployment'

  dependsOn: Build
  condition: succeeded()

  jobs:

  - deployment: DeployNaukri
    displayName: 'Deploy Naukri EXE'

    # ========================================================
    # ADO ENVIRONMENT GATE
    # ========================================================

    environment: 'Naukri-Prod'

    strategy:

      runOnce:

        deploy:

          steps:

          # ==================================================
          # DOWNLOAD ARTIFACT
          # ==================================================

          - download: current
            artifact: 'Naukri-EXE'

          # ==================================================
          # VERIFY APPROVED ARTIFACT
          # ==================================================

          - task: PowerShell@2
            displayName: 'Verify Approved Deployment Artifact'
            inputs:
              targetType: 'inline'
              script: |

                Write-Host "========================================"
                Write-Host "ENVIRONMENT APPROVAL RECEIVED"
                Write-Host "========================================"

                Write-Host "Environment : Naukri-Prod"
                Write-Host "Deployment is starting..."

                $artifactPath = "$(Pipeline.Workspace)\Naukri-EXE"

                Write-Host ""
                Write-Host "Artifact Path:"
                Write-Host $artifactPath

                if (-not (Test-Path $artifactPath)) {
                    Write-Error "Deployment artifact not found"
                    exit 1
                }

                Write-Host ""
                Write-Host "===== EXE FILES READY FOR DEPLOYMENT ====="

                $exeFiles = @(
                    Get-ChildItem `
                        -Path $artifactPath `
                        -Recurse `
                        -Filter "*.exe" `
                        -File
                )

                if ($exeFiles.Count -eq 0) {
                    Write-Error "No EXE files found in deployment artifact"
                    exit 1
                }

                foreach ($exe in $exeFiles) {

                    Write-Host "----------------------------------------"
                    Write-Host "File : $($exe.FullName)"
                    Write-Host "Size : $($exe.Length) bytes"
                    Write-Host "----------------------------------------"

                }

                Write-Host ""
                Write-Host "Artifact verification SUCCESS"


          # ==================================================
          # DEPLOYMENT PLACEHOLDER
          # ==================================================

          - task: PowerShell@2
            displayName: 'Deploy Naukri Application'
            inputs:
              targetType: 'inline'
              script: |

                Write-Host "========================================"
                Write-Host "DEPLOYMENT STARTED"
                Write-Host "========================================"

                Write-Host "Environment approval completed."

                $artifactPath = "$(Pipeline.Workspace)\Naukri-EXE"

                Write-Host "Deploying artifacts from:"
                Write-Host $artifactPath

                # ------------------------------------------------
                # ADD YOUR ACTUAL DEPLOYMENT COMMAND HERE
                # ------------------------------------------------

                # Example:
                #
                # Copy-Item `
                #   -Path "$artifactPath\*" `
                #   -Destination "C:\Naukri\Application" `
                #   -Recurse `
                #   -Force

                Write-Host ""
                Write-Host "========================================"
                Write-Host "NAUKRI DEPLOYMENT SUCCESS"
                Write-Host "========================================"