name: Deploy Naukri with Ansible

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Naukri application version"
        required: true
        default: "0.1.0"

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Show files in repository
      - name: Verify repository files
        run: |
          echo "===== REPOSITORY FILES ====="
          find . -maxdepth 3 -type f | sort

      # 3. Install Ansible
      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible pywinrm

      # 4. Install Windows collection
      - name: Install Ansible Windows collection
        run: |
          ansible-galaxy collection install ansible.windows

      # 5. Verify Ansible installation
      - name: Verify Ansible
        run: |
          ansible --version

      # 6. Create inventory dynamically
      - name: Create Ansible inventory
        env:
          VM2_HOST: ${{ secrets.VM2_HOST }}
          VM2_USERNAME: ${{ secrets.VM2_USERNAME }}
          VM2_PASSWORD: ${{ secrets.VM2_PASSWORD }}

        run: |
          cat > inventory.ini <<EOF
          [windows]
          naukri_vm ansible_host=${VM2_HOST}

          [windows:vars]
          ansible_user=${VM2_USERNAME}
          ansible_password=${VM2_PASSWORD}
          ansible_connection=winrm
          ansible_winrm_transport=ntlm
          ansible_port=5985
          ansible_winrm_server_cert_validation=ignore
          EOF

          echo "===== INVENTORY CREATED ====="
          cat inventory.ini

      # 7. Test connection to VM2
      - name: Test VM2 connectivity
        run: |
          ansible windows \
            -i inventory.ini \
            -m ansible.windows.win_ping

      # 8. Deploy NaukriAutomator
      - name: Deploy NaukriAutomator
        env:
          STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ secrets.STORAGE_CONTAINER }}
          STORAGE_SAS_TOKEN: ${{ secrets.STORAGE_SAS_TOKEN }}

        run: |
          ansible-playbook \
            -i inventory.ini \
            "Install naukri · YML" \
            -e "app_version=${{ github.event.inputs.app_version }}" \
            -e "storage_account=${STORAGE_ACCOUNT}" \
            -e "storage_container=${STORAGE_CONTAINER}" \
            -e "sas_token=${STORAGE_SAS_TOKEN}"

      # 9. Deployment completed
      - name: Deployment completed
        run: |
          echo "========================================"
          echo "NAUKRI DEPLOYMENT SUCCESSFUL"
          echo "Version: ${{ github.event.inputs.app_version }}"
          echo "Target: VM2"
          echo "========================================"
